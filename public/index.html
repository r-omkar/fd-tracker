<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e6b65">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FD Tracker">
  <title>FD Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var s = localStorage.getItem('fd.size'); if (s) document.documentElement.dataset.size = s;
      var t = localStorage.getItem('fd.theme'); if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <nav class="nav hidden" id="nav" aria-label="Main"></nav>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
